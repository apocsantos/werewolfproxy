[package]
name = "stage12-quinn-auth-proof"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
quinn = { version = "=0.11.9", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "=0.23.40", default-features = false, features = ["std", "ring"] }
rustls-webpki = { version = "=0.103.13", default-features = false, features = ["std", "ring"] }
rcgen = "=0.13.2"
ring = "=0.17.14"
serde_json = "=1.0.149"
base64 = "=0.22.1"
tokio = { version = "=1.52.3", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
werewolf-core = { path = "../../crates/werewolf-core" }
